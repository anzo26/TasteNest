
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        run: find backend/src -name '*.js' -exec node --check {} \;

      - name: Package backend
        run: |
          mkdir -p backend/build
          cp -R backend/src backend/build/
          cp -R backend/prisma backend/build/
          cp backend/package.json backend/package-lock.json backend/build/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build/
          if-no-files-found: error

      - name: Build backend Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ghcr.io/anzo26/tastenest-api:${{ github.sha }} \
            ./backend

      - name: Save Docker image as artifact
        run: |
          docker save ghcr.io/anzo26/tastenest-api:${{ github.sha }} \
            | gzip > backend-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: backend-image.tar.gz
          if-no-files-found: error
          retention-days: 7
  
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tastenest
          POSTGRES_PASSWORD: tastenest
          POSTGRES_DB: tastenest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tastenest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://tastenest:tastenest@localhost:5432/tastenest_test?schema=public
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Run backend tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: warn

  deploy:
    name: deploy
    runs-on: ubuntu-latest

    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download backend Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image

      - name: Load Docker image
        run: |
          gunzip -c backend-image.tar.gz | docker load

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/anzo26/tastenest-api:${{ github.sha }}

      - name: Download backend build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-build

      - name: Setup Node.js for migrations
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-build/package-lock.json

      - name: Install Prisma CLI dependencies
        working-directory: backend-build
        run: npm ci --include=dev

      - name: Apply production database migrations
        working-directory: backend-build
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not configured"
            exit 1
          fi

          npx prisma migrate deploy

      - name: Deploy backend to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/anzo26/tastenest-api:${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --get \
            --data-urlencode "imgURL=$IMAGE_URL" \
            "$RENDER_DEPLOY_HOOK_URL"
